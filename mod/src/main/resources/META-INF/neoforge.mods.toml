loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "handtrack"
version = "0.2.0"
displayName = "Hand Tracking (Sable)"
description = '''
Отслеживание рук с камеры (через UDP) и захват блоков/существ щипком.
Блоки становятся физическими телами Sable. Без Sable мод не запустится.
'''

[[dependencies.handtrack]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.handtrack]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"

# ОБЯЗАТЕЛЬНАЯ зависимость: без Sable игра не загрузится и покажет, чего не хватает
[[dependencies.handtrack]]
modId = "sable"
type = "required"
versionRange = "[2.0.0,)"
ordering = "AFTER"
side = "BOTH"
