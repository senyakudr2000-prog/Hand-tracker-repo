plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = project.mod_version
group = 'com.example.handtrack'
base { archivesName = project.mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    exclusiveContent { // Sable
        forRepository {
            maven {
                url = "https://maven.ryanhcode.dev/releases"
                name = "RyanHCode Maven"
            }
        }
        filter {
            includeGroup("dev.ryanhcode.sable")
            includeGroup("dev.ryanhcode.sable-companion")
        }
    }
    maven { url = "https://maven.blamejared.com/" }   // Veil (транзитивная зависимость Sable)
    maven { url = "https://api.modrinth.com/maven" }
}

neoForge {
    version = project.neo_version
}

dependencies {
    // Sable нужен только для компиляции; в игре его должен поставить пользователь (в mods.toml он required)
    compileOnly "dev.ryanhcode.sable:sable-common-${project.minecraft_version}:${project.sable_version}"
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
