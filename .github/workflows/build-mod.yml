name: Build mod
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mod/**', '.github/workflows/build-mod.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.12' }
      - run: gradle -p mod build --no-daemon --stacktrace
      - run: ls -la mod/build/libs
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mod-${{ github.run_number }}
          name: Mod build ${{ github.run_number }}
          files: mod/build/libs/handtrack-*.jar
